<text x="1184" y="1360" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">3</text>
<rect x="56" y="1428" width="1488" height="226" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1467" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">04  当前写入与历史读取</text>
<text x="80" y="1504" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">写新 KV：slot_mapping=[10,11,2]，每层把当前 K/V scatter 到对应物理位置。</text>
<text x="80" y="1538" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">读旧 KV：Attention 通过 block_table 和有效长度，按逻辑顺序找到每个位置的向量。</text>
<text x="80" y="1572" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">内核可直接读取分页缓存；图中“拼成矩阵”只为推导，不表示每轮先复制完整历史。</text>
<text x="80" y="1606" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">每层都保存自己的 KV；分页仍有尾块未用槽与元数据开销，不会消除全部显存成本。</text>
<rect x="56" y="1676" width="1488" height="64" rx="12" fill="#e5f6f1" stroke="#d9e3ee"/>
<text x="80" y="1716" font-size="21" fill="#087f8c" font-weight="700" text-anchor="start">交给下一步 → A table=[5,1]、R1 slots=[10,11,2] → 05：执行 Prefill</text>
