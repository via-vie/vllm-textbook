<text x="884" y="1306" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">1</text>
<rect x="1170" y="1274" width="350" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="1184" y="1306" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">2</text>
<rect x="80" y="1328" width="240" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="94" y="1360" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">3（下轮）</text>
<rect x="320" y="1328" width="250" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="334" y="1360" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">1</text>
<rect x="570" y="1328" width="300" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
