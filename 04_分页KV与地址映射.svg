<text x="884" y="1198" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">5</text>
<rect x="1170" y="1166" width="350" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="1184" y="1198" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">10</text>
