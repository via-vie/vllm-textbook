<text x="1228" y="732" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">物理块 2</text>
<text x="1228" y="766" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">空闲</text>
<rect x="610" y="830" width="280" height="96" rx="12" fill="#f4f6f9" stroke="#d9e3ee"/>
<text x="628" y="862" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">物理块 3</text>
<text x="628" y="896" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">空闲</text>
<rect x="910" y="830" width="280" height="96" rx="12" fill="#f4f6f9" stroke="#d9e3ee"/>
<text x="928" y="862" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">物理块 4</text>
<text x="928" y="896" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">空闲</text>
<rect x="1210" y="830" width="280" height="96" rx="12" fill="#e5f6f1" stroke="#d9e3ee"/>
<text x="1228" y="862" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">物理块 5</text>
<text x="1228" y="896" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">p0,p1</text>
<path d="M480 745L1200 875" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr4)"/>
<path d="M480 885L900 745" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr4)"/>
<text x="80" y="983" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">图只画块 0–5；还有块 6–11。块 1 和块 5 无须搬到相邻地址。</text>
<rect x="56" y="1036" width="1488" height="370" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1075" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">03  位置 p → 逻辑块 → 物理块 → 槽位</text>
<rect x="80" y="1112" width="240" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="94" y="1144" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">p</text>
<rect x="320" y="1112" width="250" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="334" y="1144" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">ℓ=⌊p/b⌋</text>
<rect x="570" y="1112" width="300" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="584" y="1144" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">offset=p mod b</text>
<rect x="870" y="1112" width="300" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="884" y="1144" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">phys=table[ℓ]</text>
<rect x="1170" y="1112" width="350" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="1184" y="1144" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">slot=phys×b+offset</text>
<rect x="80" y="1166" width="240" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="1198" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">0</text>
