<text x="778" y="392" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">每一行的身份始终一致</text>
<text x="778" y="426" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">第 0 行：小猫 / p0 / 槽10</text>
<text x="778" y="456" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">第 1 行：喜欢 / p1 / 槽11</text>
<text x="778" y="486" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">第 2 行：吃 / p2 / 槽2</text>
<text x="80" y="555" font-size="22" fill="#087f8c" font-weight="400" text-anchor="start">RMSNorm → Q/K/V 投影 → 拆成 2 头；Q/K 用各自位置做 RoPE；V 不做 RoPE。</text>
<rect x="56" y="608" width="1488" height="305" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="647" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">02  head 0 的 Prefill K/V：这些真实数值将被缓存</text>
<text x="80" y="682" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">K₀ [3,2]，已经过 RoPE</text>
