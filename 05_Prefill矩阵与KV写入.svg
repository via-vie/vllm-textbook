<text x="650" y="1036" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">p0 只读 [0]；p1 读 [0,1]；p2 读 [0,1,2]。</text>
<text x="650" y="1075" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">Attention → Concat → W_O → 残差。</text>
<text x="650" y="1114" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">RMSNorm → SwiGLU FFN → 残差 → 最终归一化。</text>
<text x="650" y="1153" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">形状：[3,4] → [3,2,2] → 合并回 [3,4]。</text>
<text x="80" y="1208" font-size="22" fill="#087f8c" font-weight="400" text-anchor="start">批量并行是同时计算多行；因果 mask 保证每行只依赖合法上下文。</text>
<rect x="56" y="1261" width="1488" height="226" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1300" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">04  取 Prompt 最后一行，预测下一个 ID</text>
<text x="80" y="1337" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">尾行最终隐藏状态 [1,4] × W_lm[4,12] → logits[1,12]。</text>
<text x="80" y="1371" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">本例 temperature=0 取 argmax，选择 ID8“鱼”；其普通 Softmax 概率是 0.988102。</text>
<text x="80" y="1405" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">8 可立即反分词为“鱼”并发送；A 的 c=3，known_ids 已成为 [11,10,7,8]。</text>
<text x="80" y="1439" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">刚生成的 8 还没有 KV；下轮计算 p3 才会产生它的 K/V。</text>
<rect x="56" y="1509" width="1488" height="64" rx="12" fill="#e5f6f1" stroke="#d9e3ee"/>
<text x="80" y="1549" font-size="21" fill="#087f8c" font-weight="700" text-anchor="start">交给下一步 → 缓存 p0–p2、采样 ID8 → 06：输入 8，分页读历史并 Decode</text>
