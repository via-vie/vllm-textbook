<text x="56" y="99" font-size="38" fill="white" font-weight="700" text-anchor="start">Prefill：ID、位置和槽位一起交给模型</text>
<text x="56" y="145" font-size="21" fill="#cbd9eb" font-weight="400" text-anchor="start">沿用上级模型的实际矩阵；分页改变摆放方式，前向仍按模型结构执行。</text>
