<text x="1000" y="709" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">head 1 也有独立 K/V。</text>
<text x="1000" y="744" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">Q 只供本轮 Attention。</text>
<text x="1000" y="779" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">历史 Q 通常不缓存。</text>
<text x="1000" y="814" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">完整矩阵见 _data。</text>
<text x="80" y="882" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">在多层模型中，每层都重复此过程；该层 KV 来自该层输入，不能只存最后一层。</text>
<rect x="56" y="935" width="1488" height="304" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="974" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">03  因果 Attention：多行并行，也不能看未来</text>
<text x="80" y="1009" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">head 0 的 P=softmax(mask(QKᵀ/√2))</text>
