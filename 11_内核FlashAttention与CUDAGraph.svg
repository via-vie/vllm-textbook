<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2029" viewBox="0 0 1600 2029" role="img" aria-labelledby="title11 desc11"><title id="title11">执行加速：分页、FlashAttention、编译与图</title><desc id="desc11">这些机制作用于不同成本，可以组合；不要把它们当成同一种优化。。解释每步输入、处理与输出。</desc><defs><marker id="arr11" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1600" height="2029" fill="#f3f6fb"/>
<rect x="0" y="0" width="1600" height="182" rx="0" fill="#14243b" stroke="#d9e3ee"/>
<text x="56" y="38" font-size="17" fill="#9ec5ff" font-weight="700" text-anchor="start">vLLM EXPLAINED / 11 / 14</text>
<text x="56" y="99" font-size="38" fill="white" font-weight="700" text-anchor="start">执行加速：分页、FlashAttention、编译与图</text>
<text x="56" y="145" font-size="21" fill="#cbd9eb" font-weight="400" text-anchor="start">这些机制作用于不同成本，可以组合；不要把它们当成同一种优化。</text>
<rect x="56" y="206" width="1488" height="58" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="78" y="243" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">本步输入 → 带块表的 packed batch + 模型权重 + GPU 工作区</text>
<rect x="56" y="284" width="1488" height="370" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="323" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">01  四类机制分别减少什么</text>
<rect x="80" y="360" width="330" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="94" y="392" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">机制</text>
<rect x="410" y="360" width="600" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="424" y="392" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">优化目标</text>
<rect x="1010" y="360" width="510" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="1024" y="392" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">边界</text>
<rect x="80" y="414" width="330" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="446" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">Paged KV / PagedAttention</text>
<rect x="410" y="414" width="600" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="424" y="446" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">定位和分配历史 KV，支持共享，减少浪费</text>
<rect x="1010" y="414" width="510" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="1024" y="446" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">不自动减少 Dense Attention 要读取的历史。</text>
<rect x="80" y="468" width="330" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="94" y="500" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">FlashAttention 类内核</text>
<rect x="410" y="468" width="600" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="424" y="500" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">tiling + 在线 Softmax，避免完整 S/P 的 HBM 往返</text>
<rect x="1010" y="468" width="510" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="1024" y="500" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">计算 tile 与 KV 分配块不是同一种块。</text>
<rect x="80" y="522" width="330" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="554" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">融合 / torch.compile</text>
<rect x="410" y="522" width="600" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="424" y="554" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">减少中间张量、Python 调用和小 kernel 成本</text>
<rect x="1010" y="522" width="510" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="1024" y="554" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">可融合范围取决于模型、算子与后端。</text>
<rect x="80" y="576" width="330" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="94" y="608" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">CUDA Graph replay</text>
<rect x="410" y="576" width="600" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="424" y="608" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">减少重复执行路径的 CPU 发射开销</text>
<rect x="1010" y="576" width="510" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="1024" y="608" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">不缓存模型预测；本轮输入与 KV 仍然更新。</text>
<rect x="56" y="676" width="1488" height="305" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="715" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">02  本轮执行穿过多层优化</text>
<rect x="80.0" y="752" width="315.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="98.0" y="784" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">输入打包</text>
<text x="98.0" y="818" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">IDs / positions</text>
<text x="98.0" y="848" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">slot / block 元数据</text>
<path d="M400.0 818L447.0 818" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr11)"/>
<rect x="455.0" y="752" width="315.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="473.0" y="784" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">投影与 Norm</text>
<text x="473.0" y="818" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">Linear 矩阵乘法</text>
<text x="473.0" y="848" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">可融合的执行子图</text>
<path d="M775.0 818L822.0 818" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr11)"/>
<rect x="830.0" y="752" width="315.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="848.0" y="784" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">Attention 后端</text>
<text x="848.0" y="818" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">直接读取 paged KV</text>
<text x="848.0" y="848" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">分块 QK / Softmax / AV</text>
<path d="M1150.0 818L1197.0 818" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr11)"/>
<rect x="1205.0" y="752" width="315.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="1223.0" y="784" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">FFN 与输出</text>
<text x="1223.0" y="818" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">SwiGLU / Linear</text>
<text x="1223.0" y="848" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">logits 与采样</text>
<text x="80" y="950" font-size="21" fill="#087f8c" font-weight="400" text-anchor="start">CUDA Graph 可覆盖适用的整个执行段或子段；不兼容部分采用其他执行路径。</text>
<rect x="56" y="1003" width="1488" height="226" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1042" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">03  Prefill 与 Decode 为什么受益不同</text>
<text x="80" y="1079" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">Prefill 的 Q 有很多行，通常更容易利用大矩阵计算；避免 N×N 中间 S/P 全量落显存尤其有价值。</text>
<text x="80" y="1113" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">Decode 每请求通常只有1个 Q 行；上下文越长，扫描 KV 的带宽与并行度越关键。</text>
<text x="80" y="1147" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">小 batch 或单轮 GPU 很快时，CPU 调度、输入准备和多次 kernel 发射也会成为明显成本。</text>
<text x="80" y="1181" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">Prefill偏计算、Decode偏带宽是常见趋势，实际仍由模型、batch、上下文和硬件共同决定。</text>
<rect x="56" y="1251" width="1488" height="305" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1290" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">04  CUDA Graph 不是把第一次输出拿来复用</text>
<rect x="80.0" y="1327" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="98.0" y="1359" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">预热 / 捕获</text>
<text x="98.0" y="1393" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">准备适用形状和路径</text>
<text x="98.0" y="1423" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">保持稳定的缓冲区</text>
<path d="M525.0 1393L572.0 1393" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr11)"/>
<rect x="580.0" y="1327" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="598.0" y="1359" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">每轮更新输入</text>
<text x="598.0" y="1393" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">填入新 IDs / positions</text>
<text x="598.0" y="1423" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">更新 slot 与元数据</text>
<path d="M1025.0 1393L1072.0 1393" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr11)"/>
<rect x="1080.0" y="1327" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="1098.0" y="1359" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">分派与重放</text>
<text x="1098.0" y="1393" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">选兼容形状桶 / 图</text>
<text x="1098.0" y="1423" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">不匹配时切换路径</text>
<text x="80" y="1525" font-size="21" fill="#087f8c" font-weight="400" text-anchor="start">形状桶 / padding 可提高复用率，也可能增加额外计算；捕获还需要启动时间和图内存。</text>
<rect x="56" y="1578" width="1488" height="192" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1617" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">05  原内核文档与现行 vLLM 的关系</text>
<text x="80" y="1654" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">官方 Paged Attention 页面描述一个特定单 Query 内核；现行 vLLM 按模型与硬件选择兼容后端。</text>
<text x="80" y="1688" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">各后端支持的分页布局、head size、dtype、混合 batch 与 CUDA Graph 路径并不完全相同。</text>
<text x="80" y="1722" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">本图解释寻址和计算原理，不假定每张显卡都使用同一份历史 CUDA 内核。</text>
<rect x="56" y="1792" width="1488" height="64" rx="12" fill="#e5f6f1" stroke="#d9e3ee"/>
<text x="80" y="1832" font-size="21" fill="#087f8c" font-weight="700" text-anchor="start">交给下一步 → 单 Worker 的高效执行 → 12：扩展到多个 GPU</text>
<text x="56" y="1892" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">参考原文 · 官方设计 / 论文；案例与数值推导为原创教学示例</text>
