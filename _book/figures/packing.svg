<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>MRV2：五种索引不能混在一起</title><desc>A/B 的块7假设内容为同一完整前缀；Attention 元数据必须防止跨请求混读。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">MRV2：五种索引不能混在一起</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">请求 / 持久行 / 本轮查询</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">A → row2</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">n=1；positions=[19]；seq_len=20</text><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">B → row0</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">n=3；positions=[16,17,18]；len=19</text><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">C → row3</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">n=4；positions=[0,1,2,3]；len=4</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">拼接布局</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">idx_mapping</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">[2,0,3]：batch → 持久行</text><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">query_start_loc</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">[0,1,4,8]：本轮查询分段</text><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7