<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>同一个请求，在不同层是不同合同</title><desc>核心 Request、前端 RequestState、GPU 持久行不共享 Python 对象身份，必须显式同步。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">同一个请求，在不同层是不同合同</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">前端 → 核心</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">HTTP / EngineInput</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">messages / IDs 与生成参数</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">EngineCoreRequest</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">可序列化输入、内部 ID、client_index</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">Request</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">核心可变历史、状态与调度计数</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">核心 → 设备</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">SchedulerOutput</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">每请求算几个 token、块增量、结束 ID</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">InputBatch / metadata</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">拼接 IDs、位置、长度、索引与地址</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">模型 / Sampler</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">hidden → logits → token IDs</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">设备 → 前端</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">ModelRunnerOutput</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">结果行映射、采样 IDs、统计</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">EngineCoreOutput</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">核心接受的新 IDs 与 finish reason</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">RequestOutput</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">增量文本、用户 ID、最终标志</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">核心 Request、前端 RequestState、GPU 持久行不共享 Python 对象身份，必须显式同步。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>