<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>统一 token 预算：prefill 与 decode 同批</title><desc>这是手算条件下的教学计划；真实 Scheduler 还考虑更多模型与配置分支。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">统一 token 预算：prefill 与 decode 同批</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">简化条件：预算 8，A/B 已运行</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">A：decode 需 1</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">known-computed=1；安排1</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">B：剩余 prefill 3</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">安排3；剩余预算4</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">C：新输入剩20</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">分块安排4；输入仍未完成</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">计划与约束</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">计划 {A:1,B:3,C:4}</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">总 token=8；不同查询长度同批</text><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">其他准入约束</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">请求数、KV、长度、预留、优先级</text><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">未完成 prefill</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">num_sampled=0；不能提交续写</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">容量不足</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">申请新块失败</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">先判断容量与可安全回收空间</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">可能抢占</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">PREEMPTED、保留 token、重置进度</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">后续重算</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">恢复 KV 有成本，受安全释放限制</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">这是手算条件下的教学计划；真实 Scheduler 还考虑更多模型与配置分支。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>