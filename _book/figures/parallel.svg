<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>并行切什么：请求、层、张量还是专家</title><desc>并行方式不替代前端/核心/Runner 合同，而是改变其中的张量归属、通信与执行边界。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">并行切什么：请求、层、张量还是专家</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">模型内切分</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">TP：切层内矩阵/头</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">列分片可拼接；行贡献需要求和</text><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">PP：切层</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">阶段间传激活，各持部分层 KV</text><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">EP：切专家</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">MoE token 分发和结果合并</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">服务副本</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">DP：请求路由到副本</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">通常每副本独立权重和请求 KV</text><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">组合拓扑</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">TP×PP×DP 等决定 rank 与通信组</text><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">执行器边界</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">多进程/Ray 改变 Worker 位置</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">不可简单相除</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">KV 头可能复制</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">Hkv &lt; TP 时按实现复制头</text><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">通信有成本</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">NVLink / PCIe / 网络不同</text><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">单 A100 验收</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">先推导源码；不伪造多卡实测</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">并行方式不替代前端/核心/Runner 合同，而是改变其中的张量归属、通信与执行边界。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>