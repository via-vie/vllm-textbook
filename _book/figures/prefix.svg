<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>前缀身份与引用生命周期</title><desc>普通 Dense 主线按完整块命中；特殊 Hybrid/Mamba 部分前缀路径需单独阅读。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">前缀身份与引用生命周期</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">身份：P 为相同16-token前缀</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">A=P+私有尾部</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">H(ROOT,P,extra) → 物理块7</text><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">B=P+不同尾部</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">同父前缀同身份，可共享块7</text><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">改变父前缀 / salt</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">哈希不同，不能错误复用</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">活动引用</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">A 与 B 正在使用</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">ref(7)=2</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">A 完成</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">ref(7)=1，不能覆盖</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">B 完成</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">ref(7)=0，哈希内容仍可保留</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">再利用</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">新请求查找</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">可命中保留身份，再 touch</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">需要重新分配</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">从可用队列取块并淘汰旧身份</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">写入新内容</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">旧缓存身份失效，不是 cudaFree</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">普通 Dense 主线按完整块命中；特殊 Hybrid/Mamba 部分前缀路径需单独阅读。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>