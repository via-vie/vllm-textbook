<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><title>单卡在线请求的真实进程与设备边界</title><desc>API前端与EngineCore为CPU进程，单卡uni执行器中的Worker是对象；GPU列为设备资源。箭头展示一条请求及返回链。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456b95"/></marker></defs><rect width="1200" height="850" rx="18" fill="#f4f7fb"/><text x="26" y="43" font-size="27" fill="#233344" font-weight="700">单卡在线请求：进程边界、数据交接与返回链</text><rect x="20" y="77" width="365" height="723" rx="13" fill="#edf3ff" stroke="#c5d3dd"/><text x="36" y="106" font-size="18" fill="#233344" font-weight="700">API 前端进程</text><rect x="405" y="77" width="390" height="723" rx="13" fill="#e8f6ef" stroke="#c5d3dd"/><text x="421" y="106" font-size="18" fill="#233344" font-weight="700">EngineCore 进程 · uni</text><rect x="815" y="77" width="365" height="723" rx="13" fill="#fff4df" stroke="#c5d3dd"/><text x="831" y="106" font-size="18" fill="#233344" font-weight="700">GPU 设备 · 不是第三进程</text><rect x="45" y="125" width="305" height="78" rx="10" fill="#fff" stroke="#aebfce"/><text x="59" y="152" font-size="17" fill="#233344" font-weight="700">① 路由 → Renderer / 输入校验</text><text x="59" y="179" font-size="15" fill="#233344" font-weight="400">messages → 模板 → IDs / 参数</text><rect x="45" y="250" width="305" height="90" rx="10" fill="#fff" stroke="#aebfce"/><text x="59" y="277" font-size="17" fill="#233344" font-weight="700">② AsyncLLM / CoreClient</text><text x="59" y="304" font-size="15" fill="#233344" font-weight="400">先登记 collector；发送请求</text><rect x="430" y="125" width="340" height="78" rx="10" fill="#fff" stroke="#aebfce"/><text x="444" y="152" font-size="17" fill="#233344" font-weight="700">启动产物</text><text x="444" y="179" font-size="15" fill="#233344" font-weight="400">配置、Scheduler、KV池、模型已就绪</text><rect x="430" y="250" width="340" height="90" rx="10" fill="#fff" stroke="#aebfce"/><text x="444" y="277" font-size="17" fill="#233344" font-weight="700">③ EngineCoreRequest → Request</text><text x="444" y="304" font-size="15" fill="#233344" font-weight="400">内部 ID、token 历史、WAITING</text><rect x="430" y="390" width="340" height="90" rx="10" fill="#fff" stroke="#aebfce"/><text x="444" y="417" font-size="17" fill="#233344" font-weight="700">④ Scheduler / KVCacheManager</text><text x="444" y="444" font-size="15" fill="#233344" font-weight="400">预算与块分配 → 执行计划</text><rect x="430" y="530" width="340" height="100" rx="10" fill="#fff" stroke="#aebfce"/><text x="444" y="557" font-size="17" fill="#233344" font-weight="700">⑤ Executor → Worker → MRV2</text><text x="444" y="584" font-size="15" fill="#233344" font-weight="400">同进程对象；打包输入、调用模型</text><rect x="840" y="125" width="310" height="98" rx="10" fill="#fff" stroke="#aebfce"/><text x="854" y="152" font-size="17" fill="#233344" font-weight="700">常驻模型权重</text><text x="854" y="179" font-size="15" fill="#233344" font-weight="400">embedding / Attention / MLP / head</text><rect x="840" y="270" width="310" height="98" rx="10" fill="#fff" stroke="#aebfce"/><text x="854" y="297" font-size="17" fill="#233344" font-weight="700">逐层 KV 张量与缓冲区</text><text x="854" y="324" font-size="15" fill="#233344" font-weight="400">CPU 块表连接逻辑位置与物理槽</text><rect x="840" y="530" width="310" height="100" rx="10" fill="#fff" stroke="#aebfce"/><text x="854" y="557" font-size="17" fill="#233344" font-weight="700">⑥ 模型内核 / Attention / 采样</text><text x="854" y="584" font-size="15" fill="#233344" font-weight="400">写本轮 KV；读历史；选择新 IDs</text><rect x="430" y="690" width="340" height="80" rx="10" fill="#fff" stroke="#aebfce"/><text x="444" y="717" font-size="17" fill="#233344" font-weight="700">⑦ 核心回填与停止 / 释放</text><text x="444" y="744" font-size="15" fill="#233344" font-weight="400">计划 + 结果 → 状态 / 核心输出</text><rect x="45" y="690" width="305" height="80" rx="10" fill="#fff" stroke="#aebfce"/><text x="59" y="717" font-size="17" fill="#233344" font-weight="700">⑧ OutputProcessor → 用户</text><text x="59" y="744" font-size="15" fill="#233344" font-weight="400">增量解码 → collector → SSE</text><path d="M197 203V250" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="205" y="232" font-size="13" fill="#456b95" font-weight="400">EngineInput</text><path d="M350 295H430" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="369" y="284" font-size="13" fill="#456b95" font-weight="400">ADD</text><path d="M600 340V390" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="612" y="369" font-size="13" fill="#456b95" font-weight="400">schedule</text><path d="M600 480V530" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="612" y="511" font-size="13" fill="#456b95" font-weight="400">SchedulerOutput</text><path d="M770 580H840" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="786" y="567" font-size="13" fill="#456b95" font-weight="400">输入</text><path d="M995 368V530" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1007" y="451" font-size="13" fill="#456b95" font-weight="400">读 / 写 KV</text><path d="M1150 174H1165V580H1150" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 630V730H770" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="841" y="700" font-size="13" fill="#456b95" font-weight="400">token IDs / stats</text><path d="M430 730H350" stroke="#456b95" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="356" y="714" font-size="13" fill="#456b95" font-weight="400">核心输出</text><text x="26" y="826" font-size="14" fill="#526d81" font-weight="400">主线：TP=PP=DP=1，普通文本、同步调度。取消和零 token 清理另见生命周期章；源码 v0.30.0 / ced6857。</text></svg>