<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>请求到达前：从配置到可用执行器</title><desc>KV 预算不是 nvidia-smi 的全部空闲显存；显式字节预算和 profiling 路径要分清。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">请求到达前：从配置到可用执行器</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">配置与实现</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">CLI → EngineArgs</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">模型、长度、并行、调度、缓存配置</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">VllmConfig</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">兼容性检查，选择 Runner 与执行路径</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">EngineCore → Executor</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">单卡 uni；多卡使用其他执行器</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">设备与容量</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">Worker.init_device</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">设备、通信环境、内存观察点</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">load_model / profile</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">加载权重，估计非 KV 内存开销</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">KV 配置与初始化</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">规格分组、物理块数、GPU KV 张量</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">执行就绪</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">Runner 初始化</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">持久状态、输入缓冲区和后端</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">compile / warm-up</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">按配置编译、预热或捕获图</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">Scheduler 就绪</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">空闲块池、请求表与调度预算</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">KV 预算不是 nvidia-smi 的全部空闲显存；显式字节预算和 profiling 路径要分清。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>