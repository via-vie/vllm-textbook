<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>分页管理地址，FlashAttention 优化计算 IO</title><desc>减少中间矩阵读写不等于稀疏近似；真实精度与性能需在选定硬件/后端验证。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">分页管理地址，FlashAttention 优化计算 IO</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">模型层</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">H → Q/K/V</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">Q/K Norm、RoPE；逻辑位置</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">KV update</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">按 slot_mapping 写本轮 K/V</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">Attention</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">按块表和长度读取可见历史</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">分块在线归并</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">每块统计</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">m=max(score)，l=Σexp(score-m)</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">加权向量</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">u=Σexp(score-m)·V</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">合并与输出</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">按共同 m 缩放；最后 O=u/l</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">性能边界</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">prefill</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">多查询；避免完整 N² S/P 写回 HBM</text><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">decode</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">少查询；历史 KV/权重读取更关键</text><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">三种块</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">KV page、计算 tile、线程块各司其职</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">减少中间矩阵读写不等于稀疏近似；真实精度与性能需在选定硬件/后端验证。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>