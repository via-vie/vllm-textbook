<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>输出、停止、取消与安全释放</title><desc>前端结束、核心结束、KV 可复用、Worker 删除是相关但不必同一时刻完成的事件。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">输出、停止、取消与安全释放</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">正常输出</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">Sampler → 核心</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">结果按 request_id/行索引回填</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">核心停止检查</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">EOS / stop ID / 长度；产生输出</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">前端增量解码</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">ID → 文本；可能发现 stop 字符串</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">取消回路</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">用户断开 / 字符串停止</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">generate 清理或 OutputProcessor abor</text><text x="50" y="434" fill="#233344" font-size="17" font-weight="400">t</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">ABORT → EngineCore</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">在采纳结果前处理取消</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">在途工作</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">可能仍在写 GPU KV，不能立刻复用</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">资源回收</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">fence 安全条件</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">last_sched_seq ≤ processed_step_seq</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">归还引用 / 核心移除</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">缓存大张量仍常驻</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">finished_req_ids → Worker</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">后续清理持久行，可零 token</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">前端结束、核心结束、KV 可复用、Worker 删除是相关但不必同一时刻完成的事件。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>