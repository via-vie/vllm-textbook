<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>逻辑位置 → 逻辑块 → 物理槽</title><desc>slot 是后端索引语义；实际字节布局还含层、K/V、头、维度、dtype 与对齐。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">逻辑位置 → 逻辑块 → 物理槽</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">请求 A · b=16 · 块表 [7,2]</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">position p=19</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">逻辑序列位置，与 batch 下标无关</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">j=19//16=1，r=3</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">第2个逻辑块，第4个槽</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">physical=table[1]=2</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">slot=2×16+3=35</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">本轮写入与历史读取</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">KVCacheManager</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">分配/接纳块；更新 CPU 元数据</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">Runner slot_mapping</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">本轮 token 的写入位置</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">Attention backend</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">按块表读取可见历史 K/V</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">必须分清</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">逻辑连续</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">token 顺序保持 0,1,2,…</text><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">物理可离散</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">块7和块2不必相邻</text><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">数值何时有效</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">真实 KV 写入/传输完成之后</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">slot 是后端索引语义；实际字节布局还含层、K/V、头、维度、dtype 与对齐。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>