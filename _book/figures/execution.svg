<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>eager、compile、CUDA Graph 的职责</title><desc>图重放不复用旧答案；每次仍用新输入执行，收益取决于当前瓶颈。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">eager、compile、CUDA Graph 的职责</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">三类机制</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">算子融合</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">减少中间写回与 launch 数</text><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">torch.compile</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">分析/优化图，生成执行代码</text><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">CUDA Graph</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">捕获并重放 GPU 执行结构</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">MRV2 路径</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">更新本轮输入</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">新 token 写入稳定缓冲区</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">dispatch 兼容形状</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">token/请求/LoRA 等匹配候选</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">replay 或回退</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">FULL / PIECEWISE / NONE</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">验证收益</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">固定负载与采样</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">同输入、输出、缓存冷暖、并发</text><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">分开预热与稳态</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">记录编译/捕获和回退日志</text><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">看瓶颈证据</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">CPU 间隙、kernel、padding、显存</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">图重放不复用旧答案；每次仍用新输入执行，收益取决于当前瓶颈。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>