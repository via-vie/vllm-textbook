<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><title>A 的两轮：已知、已调度与真实完成</title><desc>ready 是教学字段；num_computed_tokens 在 schedule 后提前记账，不能视为 GPU 完成证明。</desc><rect width="1200" height="850" rx="20" fill="#f4f7fb"/><text x="34" y="48" fill="#233344" font-size="27" font-weight="700">A 的两轮：已知、已调度与真实完成</text><text x="34" y="104" fill="#233344" font-size="19" font-weight="700">prefill · 输入 [11,10,7]</text><rect x="34" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="50" y="153" fill="#233344" font-size="18" font-weight="700">提交</text><text x="50" y="187" fill="#233344" font-size="17" font-weight="400">known=3，computed=0，ready=0</text><path d="M389 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="442" y="153" fill="#233344" font-size="18" font-weight="700">调度 A3</text><text x="442" y="187" fill="#233344" font-size="17" font-weight="400">computed=3，in_flight=3，ready=0</text><path d="M781 202h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="124" width="348" height="156" rx="13" fill="#eaf1ff" stroke="#bccbd7"/><text x="834" y="153" fill="#233344" font-size="18" font-weight="700">执行并归账</text><text x="834" y="187" fill="#233344" font-size="17" font-weight="400">ready=3，接受鱼8；known=4</text><text x="34" y="324" fill="#233344" font-size="19" font-weight="700">decode · 输入鱼8，position=3</text><rect x="34" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="50" y="373" fill="#233344" font-size="18" font-weight="700">调度 A1</text><text x="50" y="407" fill="#233344" font-size="17" font-weight="400">computed=4，in_flight=1，ready=3</text><path d="M389 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="442" y="373" fill="#233344" font-size="18" font-weight="700">模型与采样</text><text x="442" y="407" fill="#233344" font-size="17" font-weight="400">写鱼的 KV；ready=4，选择 EOS1</text><path d="M781 422h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="344" width="348" height="156" rx="13" fill="#e7f5ef" stroke="#bccbd7"/><text x="834" y="373" fill="#233344" font-size="18" font-weight="700">核心结束</text><text x="834" y="407" fill="#233344" font-size="17" font-weight="400">known=5，computed=4；归还引用</text><text x="34" y="544" fill="#233344" font-size="19" font-weight="700">最后清理</text><rect x="34" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="50" y="593" fill="#233344" font-size="18" font-weight="700">finished_req_ids</text><text x="50" y="627" fill="#233344" font-size="17" font-weight="400">下一份计划通知 Worker 删除状态</text><path d="M389 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="426" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="442" y="593" fill="#233344" font-size="18" font-weight="700">零 token 执行路径</text><text x="442" y="627" fill="#233344" font-size="17" font-weight="400">无 Transformer 前向；仍可有清理</text><path d="M781 642h24m-6 -5l6 5 -6 5" fill="none" stroke="#738696" stroke-width="2"/><rect x="818" y="564" width="348" height="156" rx="13" fill="#fff2db" stroke="#bccbd7"/><text x="834" y="593" fill="#233344" font-size="18" font-weight="700">结束</text><text x="834" y="627" fill="#233344" font-size="17" font-weight="400">EOS 不再前向；旧计数不是活跃分配</text><text x="34" y="783" fill="#516675" font-size="16" font-weight="400">ready 是教学字段；num_computed_tokens 在 schedule 后提前记账，不能视为 GPU 完成证明。</text><text x="34" y="831" fill="#607585" font-size="14" font-weight="400">vLLM v0.30.0 · ced6857 · 本书原创图解 / 具体条件见对应章节</text></svg>