<a href="https://docs.vllm.ai/en/stable/configuration/optimization/" target="_blank"><text x="806" y="1973" font-size="17" fill="#2563eb">Optimization and Tuning</text></a>
<a href="https://docs.vllm.ai/en/stable/design/arch_overview/" target="_blank"><text x="56" y="2004" font-size="17" fill="#2563eb">Architecture Overview</text></a>
</svg>