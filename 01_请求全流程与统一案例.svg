<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1725" viewBox="0 0 1600 1725" role="img" aria-labelledby="title1 desc1"><title id="title1">一条请求，如何变成持续输出</title><desc id="desc1">模型负责预测；vLLM 组织请求、计算、KV 显存和输出的生命周期。。解释每步输入、处理与输出。</desc><defs><marker id="arr1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1600" height="1725" fill="#f3f6fb"/>
<rect x="0" y="0" width="1600" height="182" rx="0" fill="#14243b" stroke="#d9e3ee"/>
<text x="56" y="38" font-size="17" fill="#9ec5ff" font-weight="700" text-anchor="start">vLLM EXPLAINED / 01 / 14</text>
<text x="56" y="99" font-size="38" fill="white" font-weight="700" text-anchor="start">一条请求，如何变成持续输出</text>
<text x="56" y="145" font-size="21" fill="#cbd9eb" font-weight="400" text-anchor="start">模型负责预测；vLLM 组织请求、计算、KV 显存和输出的生命周期。</text>
<rect x="56" y="206" width="1488" height="58" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="78" y="243" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">本步输入 → 文本“小猫喜欢吃” + 已加载的模型 / Tokenizer</text>
<rect x="56" y="284" width="1488" height="305" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="323" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">01  把既有的 Transformer 数学流程放进服务系统</text>
<rect x="80.0" y="360" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="98.0" y="392" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">客户端</text>
<text x="98.0" y="426" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">提交 Prompt / messages</text>
<text x="98.0" y="456" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">接收分段文本</text>
<path d="M525.0 426L572.0 426" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr1)"/>
<rect x="580.0" y="360" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="598.0" y="392" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">vLLM 运行时</text>
<text x="598.0" y="426" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">队列 → 调度 → KV 管理</text>
<text x="598.0" y="456" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">GPU 执行 → 返回输出</text>
<path d="M1025.0 426L1072.0 426" fill="none" stroke="#52647b" stroke-width="2.4" marker-end="url(#arr1)"/>
<rect x="1080.0" y="360" width="440.0" height="140" rx="12" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="1098.0" y="392" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">模型前向</text>
<text x="1098.0" y="426" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">IDs → 隐藏状态 → logits</text>
<text x="1098.0" y="456" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">采样得到下一 token ID</text>
<text x="80" y="558" font-size="21" fill="#087f8c" font-weight="400" text-anchor="start">读图顺序：输入是什么 → 这一层做了什么 → 状态变成什么 → 下一步拿走什么。</text>
<rect x="56" y="611" width="1488" height="424" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="650" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">02  本教程固定使用这一套参数</text>
<rect x="80" y="687" width="220" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="94" y="719" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">对象</text>
<rect x="300" y="687" width="600" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="314" y="719" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">取值</text>
<rect x="900" y="687" width="620" height="54" rx="0" fill="#eaf1ff" stroke="#d9e3ee"/>
<text x="914" y="719" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">作用</text>
<rect x="80" y="741" width="220" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="773" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">Tokenizer</text>
<rect x="300" y="741" width="600" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="314" y="773" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">V=12；[11,10,7]=[小猫,喜欢,吃]</text>
<rect x="900" y="741" width="620" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="914" y="773" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">ID 是词表索引；沿用上级教程的 BPE。</text>
<rect x="80" y="795" width="220" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="94" y="827" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">模型</text>
<rect x="300" y="795" width="600" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="314" y="827" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">D=4；h_q=h_kv=2；d=2；L=1；F=6</text>
<rect x="900" y="795" width="620" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="914" y="827" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">每 token 每层有 K[2,2] 和 V[2,2]。</text>
<rect x="80" y="849" width="220" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="881" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">运行时</text>
<rect x="300" y="849" width="600" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="314" y="881" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">b=2 token / KV 块；T=4 token / 轮</text>
<rect x="900" y="849" width="620" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="914" y="881" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">只用于画清地址，不是生产后端参数建议。</text>
<rect x="80" y="903" width="220" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="94" y="935" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">输出</text>
<rect x="300" y="903" width="600" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="314" y="935" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">A/B：8“鱼” → 1“EOS”</text>
<rect x="900" y="903" width="620" height="54" rx="0" fill="white" stroke="#d9e3ee"/>
<text x="914" y="935" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">来自上级教学模型的贪心预测。</text>
<rect x="80" y="957" width="220" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="94" y="989" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">容量与计算</text>
<rect x="300" y="957" width="600" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="314" y="989" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">按 FP16 算容量；数值计算保留完整精度</text>
<rect x="900" y="957" width="620" height="54" rx="0" fill="#f7f9fc" stroke="#d9e3ee"/>
<text x="914" y="989" font-size="21" fill="#14243b" font-weight="400" text-anchor="start">显示约 3 位小数；不把显示舍入值继续代入。</text>
<rect x="56" y="1057" width="1488" height="226" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1096" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">03  本地执行的边界</text>
<text x="80" y="1133" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">真实执行：读取既有模型数值，计算分页寻址、分块 Softmax 合并与五轮请求调度模拟，保存完整精度 JSON。</text>
<text x="80" y="1167" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">没有安装 / 运行 vLLM 或 GPU 基准；模拟省略异步、投机 token、完整输入预留和特殊模型路径。</text>
<text x="80" y="1201" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">A/B 的预测来自既有模型；长请求 C 只用来展示调度，其 [10,EOS] 是明确指定的模拟输出。</text>
<text x="80" y="1235" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">生产服务加载自己的模型检查点与 Tokenizer；不会收到请求后重新学习 BPE 或训练输出头。</text>
<rect x="56" y="1305" width="1488" height="192" rx="12" fill="white" stroke="#d9e3ee"/>
<text x="80" y="1344" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">04  token ID、向量、KV 和文本是不同对象</text>
<text x="80" y="1381" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">ID8 是索引；Embedding 把索引变成 D 维向量；逐层前向产生 K/V；反分词才产生用户看到的“鱼”。</text>
<text x="80" y="1415" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">采样到 ID8 时它的 KV 尚未计算，下一轮把 8 输入模型才得到位置 3 的 KV。</text>
<text x="80" y="1449" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">采样 EOS 后结束本例；EOS 不输入模型，所以 A 最终有 4-token KV，而输出 ID 列表是 [8,1]。</text>
<rect x="56" y="1519" width="1488" height="64" rx="12" fill="#e5f6f1" stroke="#d9e3ee"/>
<text x="80" y="1559" font-size="21" fill="#087f8c" font-weight="700" text-anchor="start">交给下一步 → 请求 A 与模型配置 → 02：准备进程、权重与 GPU 内存</text>
<text x="56" y="1619" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">参考原文 · 官方设计 / 论文；案例与数值推导为原创教学示例</text>
<a href="https://docs.vllm.ai/en/stable/design/arch_overview/" target="_blank"><text x="56" y="1655" font-size="17" fill="#2563eb">Architecture Overview</text></a>
<a href="https://vllm.ai/blog/2025-01-27-v1-alpha-release" target="_blank"><text x="806" y="1655" font-size="17" fill="#2563eb">V1 architecture blog (2025)</text></a>
</svg>