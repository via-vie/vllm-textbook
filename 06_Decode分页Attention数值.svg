<text x="80" y="1820" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">head 0 输出 [0.585, 1.254]；head 1 输出 [0.832, 0.208]；Concat 后继续残差、FFN 与 LM head。</text>
<text x="80" y="1854" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">最终选择 EOS=1，普通 Softmax 概率 0.996158；c=4，EOS 不进入下一轮。</text>
<text x="80" y="1888" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">对照完整输入 [11,10,7,8] 的无缓存重算，缓存与分页结果在浮点误差范围内一致。</text>
<text x="80" y="1922" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">这是 Dense Attention，分页并没有自动减少应读取的历史 token 数。</text>
