<text x="80" y="1143" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">03  不能每页独立 Softmax 后把输出简单平均</text>
<text x="80" y="1180" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">每页 j 计算 m_j=max(scores_j)，l_j=Σexp(score−m_j)，u_j=Σexp(score−m_j)·v。</text>
<text x="80" y="1214" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">取 m=max(m_j)，然后 l=Σexp(m_j−m)·l_j，u=Σexp(m_j−m)·u_j，最终 o=u/l。</text>
<text x="80" y="1248" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">重标定让每页分母处于同一尺度，与所有有效 token 的一次 Softmax 数学等价。</text>
<text x="80" y="1282" font-size="22" fill="#14243b" font-weight="400" text-anchor="start">分页分配块与 GPU 计算 tile / split 不必一致；这里按两页合并是原理展示。</text>
